@if (insight || isLoading || error) {
  <div class="insight-container">
    @if (isLoading) {
      <div class="loading-spinner">
        <p>Your Gardener's Assistant is reflecting...</p>
        <div class="spinner"></div>
      </div>
    }
    @if (error) {
      <div class="error-message">
        <p>{{ error }}</p>
      </div>
    }
    @if (insight && !isLoading) {
      <div class="insight-content fade-in">
        <p class="quote">“</p>
        <p class="insight-text">{{ insight.text }}</p>
        <div class="insight-footer">
          <p class="timestamp">{{ insight.timestamp | date: "medium" }}</p>
          <button
            class="listen-button"
            (click)="playInsightAudio(insight.id)"
            [disabled]="(isAudioLoading$ | async) === true"
          >
            @if ((isAudioLoading$ | async) !== true) {
              Listen 🔊
            } @else {
              <div class="spinner-small"></div>
            }
          </button>
        </div>
      </div>
    }
  </div>
}
