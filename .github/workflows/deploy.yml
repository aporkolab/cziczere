name: Deploy Memory Garden

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches-ignore: ['dependabot/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  NG_CLI_ANALYTICS: 'false'
  JAVA_VERSION: '21'
  FIREBASE_PROJECT_ID: 'cziczere-ai'

jobs:
  # Quality checks and testing
  quality-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend code
        working-directory: ./frontend
        run: npm run lint

      - name: Type check
        working-directory: ./frontend
        run: npm run build -- --configuration=production

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI

      # - name: Upload coverage reports
      #   uses: codecov/codecov-action@v3
      #   with:
      #     directory: frontend/coverage/
      #     flags: frontend
      #     name: frontend-coverage

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      - name: Build and test Cloud Functions
        run: mvn -B verify

  firebase-tools-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:dependency-guards
      - run: npm audit --audit-level=high
      - run: node node_modules/firebase-tools/lib/bin/firebase.js --version

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run security audit
        working-directory: ./frontend
        run: npm run test:dependency-guards && npm audit --audit-level=high

      - name: Run Snyk security scan
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        uses: snyk/actions/node@master
        with:
          command: test
          args: --file=frontend/package.json --severity-threshold=high
      
      - name: Run npm audit (fallback security check)
        working-directory: ./frontend
        run: npm audit --audit-level=high --omit=dev

      - name: Setup Java for CodeQL
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

          cache: maven

      - name: CodeQL Analysis
        uses: github/codeql-action/init@v4
        with:
          languages: javascript, java
          
      - name: Build Java code for CodeQL
        working-directory: ./functions
        run: mvn compile test-compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # Backend testing and deployment
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [quality-check, backend-test, security-scan, firebase-tools-check]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Test Cloud Functions
        working-directory: ./functions
        run: mvn test

      - name: Build Cloud Functions
        working-directory: ./functions
        run: mvn clean package

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify authentication and project access
        run: |
          echo "Checking authentication..."
          gcloud auth list
          echo "Current service account:"
          gcloud config get-value account
          echo "Checking project access..."
          if gcloud projects describe ${{ env.FIREBASE_PROJECT_ID }}; then
            echo "✅ Project access verified"
          else
            echo "❌ Cannot access project - check service account permissions"
            echo "Service account needs these roles:"
            echo "  - Editor or Project Editor"
            echo "  - Firebase Admin"
            echo "  - Cloud Functions Admin"
            echo "  - Service Usage Admin"
            exit 1
          fi
          echo "Checking Firebase project access..."
          if firebase projects:list; then
            echo "✅ Firebase access verified"
          else
            echo "❌ Cannot access Firebase - check service account has Firebase Admin role"
            exit 1
          fi

      - name: Deploy Cloud Functions
        run: |
          firebase deploy --only functions --project ${{ env.FIREBASE_PROJECT_ID }}

  # Frontend build and deployment
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [quality-check, backend-test, security-scan, firebase-tools-check]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Create production environment
        working-directory: ./frontend/src/environments
        run: |
          cat > environment.prod.ts << EOF
          export const environment = {
            production: true,
            firebase: {
              apiKey: '${{ secrets.FIREBASE_API_KEY }}',
              authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}',
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              appId: '${{ secrets.FIREBASE_APP_ID }}'
            },
            apis: {
              generateMemoryPlant: 'https://us-central1-${{ env.FIREBASE_PROJECT_ID }}.cloudfunctions.net/generateMemoryPlant',
              analyzeMemories: 'https://us-central1-${{ env.FIREBASE_PROJECT_ID }}.cloudfunctions.net/analyzeMemories',
              getAtmosphere: 'https://us-central1-${{ env.FIREBASE_PROJECT_ID }}.cloudfunctions.net/getAtmosphere',
              exportGarden: 'https://us-central1-${{ env.FIREBASE_PROJECT_ID }}.cloudfunctions.net/exportGarden',
              getInsightAudio: 'https://us-central1-${{ env.FIREBASE_PROJECT_ID }}.cloudfunctions.net/getInsightAudio',
              poeticRephrasing: 'https://us-central1-${{ env.FIREBASE_PROJECT_ID }}.cloudfunctions.net/poeticRephrasing',
              chatWebSocket: 'wss://${{ secrets.WEBSOCKET_DOMAIN }}/chat'
            },
            features: {
              enableAnalytics: true,
              enablePerformanceMonitoring: true,
              enableCrashlytics: true,
              enableNotifications: true,
              maxMemoriesPerUser: 1000,
              maxConversationHistory: 100,
              enableAdvancedAR: true,
              enableProfanityFilter: true,
              enableRateLimiting: true
            },
            monitoring: {
              sentryDsn: '${{ secrets.SENTRY_DSN }}',
              logLevel: 'warn',
              enableUserTracking: true,
              enableErrorReporting: true
            },
            performance: {
              enableServiceWorker: true,
              enableLazyLoading: true,
              enableImageOptimization: true,
              enableBundleAnalysis: false
            }
          };
          EOF

      - name: Build for production
        working-directory: ./frontend
        run: npm run build -- --configuration=production

      - name: Generate bundle stats
        working-directory: ./frontend
        # esbuild metafile; inspect it at https://esbuild.github.io/analyze/
        run: npm run build -- --configuration=production --stats-json --output-path=dist/stats

      - name: Upload bundle stats
        uses: actions/upload-artifact@v7
        with:
          name: bundle-analysis
          path: frontend/dist/stats/stats.json

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Verify authentication and project access
        run: |
          echo "Checking authentication..."
          gcloud auth list
          echo "Current service account:"
          gcloud config get-value account
          echo "Checking project access..."
          if gcloud projects describe ${{ env.FIREBASE_PROJECT_ID }}; then
            echo "✅ Project access verified"
          else
            echo "❌ Cannot access project - check service account permissions"
            echo "Service account needs these roles:"
            echo "  - Editor or Project Editor"
            echo "  - Firebase Admin"
            echo "  - Firebase Hosting Admin"
            echo "  - Service Usage Admin"
            exit 1
          fi
          echo "Checking Firebase project access..."
          if firebase projects:list; then
            echo "✅ Firebase access verified"
          else
            echo "❌ Cannot access Firebase - check service account has Firebase Admin role"
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        working-directory: ./frontend
        run: |
          firebase deploy --only hosting --project ${{ env.FIREBASE_PROJECT_ID }}

  # Performance testing
  performance-test:
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.15.x

      - name: Run Lighthouse CI
        run: |
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: .lighthouseci/

  # Integration tests
  integration-test:
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Detect Playwright suite
        id: detect
        run: |
          if ls playwright.config.* >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No playwright.config found, integration tests not set up yet"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright
        if: steps.detect.outputs.present == 'true'
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run integration tests
        if: steps.detect.outputs.present == 'true'
        run: npx playwright test
        env:
          BASE_URL: https://${{ env.FIREBASE_PROJECT_ID }}.web.app

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always() && steps.detect.outputs.present == 'true'
        with:
          name: playwright-report
          path: playwright-report/

  # Monitoring and notifications
  post-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend, performance-test, integration-test]
    if: always() && github.ref == 'refs/heads/main'
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      MONITORING_WEBHOOK_URL: ${{ secrets.MONITORING_WEBHOOK_URL }}

    steps:
      - name: Notify deployment success
        if: env.SLACK_WEBHOOK_URL != '' && needs.deploy-frontend.result == 'success' && needs.deploy-backend.result == 'success'
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: '🚀 Memory Garden deployed successfully!'

      - name: Notify deployment failure
        if: env.SLACK_WEBHOOK_URL != '' && contains(needs.*.result, 'failure')
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: '❌ Memory Garden deployment failed!'

      - name: Create deployment record
        if: env.MONITORING_WEBHOOK_URL != '' && needs.deploy-frontend.result == 'success'
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.MONITORING_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "service": "memory-garden",
              "version": "${{ github.sha }}",
              "environment": "production",
              "deployed_at": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
              "deployed_by": "${{ github.actor }}"
            }' \
            "$MONITORING_WEBHOOK_URL"

  # Automated monitoring setup
  setup-monitoring:
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: github.ref == 'refs/heads/main'
    env:
      UPTIME_WEBHOOK_URL: ${{ secrets.UPTIME_WEBHOOK_URL }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}

    steps:
      - name: Setup health checks
        if: env.UPTIME_WEBHOOK_URL != ''
        run: |
          # Create uptime monitoring
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.UPTIME_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "url": "https://${{ env.FIREBASE_PROJECT_ID }}.web.app",
              "name": "Memory Garden Frontend",
              "interval": 300,
              "timeout": 30
            }' \
            "$UPTIME_WEBHOOK_URL"

      - name: Setup error tracking
        if: env.SENTRY_ORG != ''
        run: |
          # Configure Sentry release
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "version": "${{ github.sha }}",
              "projects": ["memory-garden"]
            }' \
            https://sentry.io/api/0/organizations/${{ secrets.SENTRY_ORG }}/releases/
