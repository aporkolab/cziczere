name: Deploy Memory Garden

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches-ignore: ['dependabot/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  NG_CLI_ANALYTICS: 'false'
  JAVA_VERSION: '21'
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'cziczere-ai' }}

jobs:
  # Quality checks and testing
  quality-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend code
        working-directory: ./frontend
        run: npm run lint

      - name: Type check
        working-directory: ./frontend
        run: npm run build -- --configuration=production

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI

      # - name: Upload coverage reports
      #   uses: codecov/codecov-action@v3
      #   with:
      #     directory: frontend/coverage/
      #     flags: frontend
      #     name: frontend-coverage

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      - name: Build and test Cloud Functions
        run: mvn -B verify

  firebase-tools-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:dependency-guards
      - run: npm audit --audit-level=high
      - run: node node_modules/firebase-tools/lib/bin/firebase.js --version

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run security audit
        working-directory: ./frontend
        run: npm run test:dependency-guards && npm audit --audit-level=high

      - name: Run Snyk security scan
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        uses: snyk/actions/node@master
        with:
          command: test
          args: --file=frontend/package.json --severity-threshold=high
      
      - name: Run npm audit (fallback security check)
        working-directory: ./frontend
        run: npm audit --audit-level=high --omit=dev

      - name: Setup Java for CodeQL
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

          cache: maven

      - name: CodeQL Analysis
        uses: github/codeql-action/init@v4
        with:
          languages: javascript, java
          
      - name: Build Java code for CodeQL
        working-directory: ./functions
        run: mvn compile test-compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # Backend testing and deployment
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [quality-check, backend-test, security-scan, firebase-tools-check]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Deploy Java HTTP functions
        env:
          STORAGE_BUCKET: ${{ vars.FUNCTIONS_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET }}
          VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION || 'global' }}
          TEXT_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          IMAGE_MODEL: ${{ vars.IMAGEN_MODEL || 'gemini-3.1-flash-image' }}
        shell: bash
        run: |
          set -euo pipefail
          source_dir=$(mktemp -d "$RUNNER_TEMP/cziczere-functions.XXXXXX")
          mkdir "$source_dir/src"
          cp functions/pom.xml "$source_dir/"
          cp -R functions/src/main "$source_dir/src/"
          existing=$(gcloud functions list --v2 --regions=us-central1 --project="$FIREBASE_PROJECT_ID" --format='value(name.basename())')

          for class in GenerateMemoryPlant AnalyzeMemories GetAtmosphere ExportGarden GetInsightAudio PoeticRephrasing; do
            name="${class,}"
            settings="GCP_PROJECT_ID=$FIREBASE_PROJECT_ID"
            access=()
            if ! grep -Fxq "$name" <<< "$existing"; then
              if [[ -z "$STORAGE_BUCKET" ]]; then
                # Firebase's Admin SDK config contains the project's actual default bucket.
                STORAGE_BUCKET=$(curl -fsS --header "Authorization: Bearer $(gcloud auth print-access-token)" \
                  "https://firebase.googleapis.com/v1beta1/projects/$FIREBASE_PROJECT_ID/adminSdkConfig" |
                  jq -er '.storageBucket | strings | select(length > 0)') || {
                    echo "::error::No default Firebase Storage bucket found. Configure Firebase Storage or set FUNCTIONS_STORAGE_BUCKET."
                    exit 1
                  }
              fi
              settings+="|GCP_REGION=$VERTEX_LOCATION|GEMINI_MODEL=$TEXT_MODEL|IMAGEN_MODEL=$IMAGE_MODEL"
              settings+="|GCS_BUCKET_NAME=$STORAGE_BUCKET|INSIGHT_AUDIO_BUCKET=$STORAGE_BUCKET|FIREBASE_MEDIA_LINKS=true"
              settings+="|ALLOWED_ORIGINS=https://$FIREBASE_PROJECT_ID.web.app,https://$FIREBASE_PROJECT_ID.firebaseapp.com"
              # Browsers send Firebase ID tokens, which each handler verifies.
              access+=(--allow-unauthenticated)
            fi
            gcloud functions deploy "$name" --project="$FIREBASE_PROJECT_ID" --region=us-central1 \
              --gen2 --runtime=java21 --entry-point="com.cziczere.functions.$class" --source="$source_dir" \
              --trigger-http --update-env-vars="^|^$settings" "${access[@]}" --quiet --format='value(name)'
          done

  # Frontend build and deployment
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [quality-check, backend-test, security-scan, firebase-tools-check]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            functions/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install the locked Firebase CLI
        working-directory: ./functions/frontend
        run: npm ci

      - name: Create production environment
        id: config
        working-directory: ./frontend/src/environments
        env:
          WEB_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          WEB_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          WEB_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          WEB_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          WEB_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          WEB_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          WEBSOCKET_DOMAIN: ${{ secrets.WEBSOCKET_DOMAIN }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, writeFileSync } from 'node:fs';
          import { environment } from './environment.prod.ts';
          const env = process.env;
          const projectId = env.FIREBASE_PROJECT_ID;
          if (env.WEB_PROJECT_ID && env.WEB_PROJECT_ID !== projectId) {
            throw new Error('The Firebase web app and Hosting deployment must use the same project.');
          }
          const web = { apiKey: env.WEB_API_KEY, authDomain: env.WEB_AUTH_DOMAIN,
            storageBucket: env.WEB_STORAGE_BUCKET, messagingSenderId: env.WEB_SENDER_ID, appId: env.WEB_APP_ID };
          if ([web.apiKey, web.authDomain, web.messagingSenderId, web.appId].some(Boolean)) {
            if (!Object.values(web).every(Boolean)) throw new Error('Incomplete Firebase web SDK configuration.');
            environment.firebase = { ...web, projectId };
          } else {
            environment.firebase = { projectId };
            environment.firebaseConfigUrl = '/__/firebase/init.json';
            appendFileSync(env.GITHUB_OUTPUT, 'use_hosting_config=true\n');
          }
          for (const [key, url] of Object.entries(environment.apis)) {
            environment.apis[key] = url.replace('YOUR_PROJECT_ID', projectId);
          }
          if (env.WEBSOCKET_DOMAIN) environment.apis.chatWebSocket = `wss://${env.WEBSOCKET_DOMAIN}/chat`;
          environment.monitoring.sentryDsn = env.SENTRY_DSN || '';
          writeFileSync('environment.prod.ts', 'export const environment = ' + JSON.stringify(environment, null, 2) + ';\n');
          JS

      - name: Build for production
        working-directory: ./frontend
        run: npm run build -- --configuration=production

      - name: Generate bundle stats
        working-directory: ./frontend
        # esbuild metafile; inspect it at https://esbuild.github.io/analyze/
        run: npm run build -- --configuration=production --stats-json --output-path=dist/stats

      - name: Upload bundle stats
        uses: actions/upload-artifact@v7
        with:
          name: bundle-analysis
          path: frontend/dist/stats/stats.json

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Verify Hosting has a registered Firebase web app
        if: steps.config.outputs.use_hosting_config == 'true'
        run: |
          node functions/frontend/node_modules/firebase-tools/lib/bin/firebase.js apps:list WEB \
            --project "$FIREBASE_PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/firebase-apps.json" || {
              echo "::error::Cannot list registered web apps in $FIREBASE_PROJECT_ID using GCP_SA_KEY."
              jq -r '.error // empty' "$RUNNER_TEMP/firebase-apps.json" >&2
              exit 1
            }
          if ! jq -e '.result | type == "array" and length > 0' "$RUNNER_TEMP/firebase-apps.json" > /dev/null; then
            echo "::error::Register a web app in the target Firebase project before deploying Hosting."
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        working-directory: ./frontend
        run: |
          node ../functions/frontend/node_modules/firebase-tools/lib/bin/firebase.js deploy \
            --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive

  # Performance testing
  performance-test:
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.15.x

      - name: Run Lighthouse CI
        run: |
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-results
          path: .lighthouseci/

  # Integration tests
  integration-test:
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Detect Playwright suite
        id: detect
        run: |
          if ls playwright.config.* >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No playwright.config found, integration tests not set up yet"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright
        if: steps.detect.outputs.present == 'true'
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run integration tests
        if: steps.detect.outputs.present == 'true'
        run: npx playwright test
        env:
          BASE_URL: https://${{ env.FIREBASE_PROJECT_ID }}.web.app

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always() && steps.detect.outputs.present == 'true'
        with:
          name: playwright-report
          path: playwright-report/

  # Monitoring and notifications
  post-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend, performance-test, integration-test]
    if: always() && github.ref == 'refs/heads/main'
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      MONITORING_WEBHOOK_URL: ${{ secrets.MONITORING_WEBHOOK_URL }}

    steps:
      - name: Notify deployment success
        if: env.SLACK_WEBHOOK_URL != '' && needs.deploy-frontend.result == 'success' && needs.deploy-backend.result == 'success'
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: '🚀 Memory Garden deployed successfully!'

      - name: Notify deployment failure
        if: env.SLACK_WEBHOOK_URL != '' && contains(needs.*.result, 'failure')
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: '❌ Memory Garden deployment failed!'

      - name: Create deployment record
        if: env.MONITORING_WEBHOOK_URL != '' && needs.deploy-frontend.result == 'success'
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.MONITORING_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "service": "memory-garden",
              "version": "${{ github.sha }}",
              "environment": "production",
              "deployed_at": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
              "deployed_by": "${{ github.actor }}"
            }' \
            "$MONITORING_WEBHOOK_URL"

  # Automated monitoring setup
  setup-monitoring:
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: github.ref == 'refs/heads/main'
    env:
      UPTIME_WEBHOOK_URL: ${{ secrets.UPTIME_WEBHOOK_URL }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}

    steps:
      - name: Setup health checks
        if: env.UPTIME_WEBHOOK_URL != ''
        run: |
          # Create uptime monitoring
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.UPTIME_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "url": "https://${{ env.FIREBASE_PROJECT_ID }}.web.app",
              "name": "Memory Garden Frontend",
              "interval": 300,
              "timeout": 30
            }' \
            "$UPTIME_WEBHOOK_URL"

      - name: Setup error tracking
        if: env.SENTRY_ORG != ''
        run: |
          # Configure Sentry release
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "version": "${{ github.sha }}",
              "projects": ["memory-garden"]
            }' \
            https://sentry.io/api/0/organizations/${{ secrets.SENTRY_ORG }}/releases/
