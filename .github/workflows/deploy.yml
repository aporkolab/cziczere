name: Memory Garden CI

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches-ignore: ['dependabot/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  NG_CLI_ANALYTICS: 'false'
  JAVA_VERSION: '21'

jobs:
  # Quality checks and testing
  quality-check:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend code
        working-directory: ./frontend
        run: npm run lint -- --max-warnings=0

      - name: Type check
        working-directory: ./frontend
        run: npm run build -- --configuration=production

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI

      # - name: Upload coverage reports
      #   uses: codecov/codecov-action@v3
      #   with:
      #     directory: frontend/coverage/
      #     flags: frontend
      #     name: frontend-coverage

  backend-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      - name: Build and test Cloud Functions
        run: mvn -B verify

  firebase-tools-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: functions/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: functions/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:dependency-guards
      - run: npm audit --audit-level=high
      - run: node node_modules/firebase-tools/lib/bin/firebase.js --version

  # Security scanning
  security-scan:
    runs-on: ubuntu-24.04
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run security audit
        working-directory: ./frontend
        run: npm run test:dependency-guards && npm audit --audit-level=high

      - name: Run Snyk security scan
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        uses: snyk/actions/node@master
        with:
          command: test
          args: --file=frontend/package.json --severity-threshold=high
      
      - name: Run npm audit (fallback security check)
        working-directory: ./frontend
        run: npm audit --audit-level=high --omit=dev

      - name: Setup Java for CodeQL
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

          cache: maven

      - name: CodeQL Analysis
        uses: github/codeql-action/init@v4
        env:
          # The Maven-traced Java build requires a full CodeQL database.
          CODEQL_OVERLAY_DATABASE_MODE: none
        with:
          languages: javascript, java
          
      - name: Build Java code for CodeQL
        working-directory: ./functions
        run: mvn compile test-compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
