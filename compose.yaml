services:
  backend:
    build: ./functions
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-adc.json
      GCP_PROJECT_ID: ${CZ_PROJECT_ID:-}
      GOOGLE_CLOUD_PROJECT: ${CZ_PROJECT_ID:-}
      GCP_REGION: ${GCP_REGION:-us-central1}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-${CZ_STORAGE_BUCKET:-}}
      INSIGHT_AUDIO_BUCKET: ${INSIGHT_AUDIO_BUCKET:-${CZ_STORAGE_BUCKET:-}}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      IMAGEN_MODEL: ${IMAGEN_MODEL:-}
      ALLOWED_ORIGINS: http://localhost:${CZ_PORT:-4200}
    volumes:
      - type: bind
        source: ${CZ_ADC_PATH:-./.cziczere/missing-credentials}
        target: /run/secrets/google-adc.json
        read_only: true
        bind:
          create_host_path: false

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${CZ_PORT:-4200}:8080"
    volumes:
      - type: bind
        source: ./.cziczere/public
        target: /etc/cziczere/public
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
